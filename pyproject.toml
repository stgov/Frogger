[project]
name = "deep_rl_agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "santiago", email = "santiago.valenzuela@uc.cl" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "ale-py>=0.12.0",
    "gymnasium[other]>=1.3.0",
    "pygame>=2.6.1",
    "tensorboard>=2.21.0",
    "torch",
]

[project.scripts]
deep_rl_agent = "deep_rl_agent:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyrefly>=1.2.0",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "RUF"]

[tool.pyrefly]
project-includes = ["**/*.py"]
project-excludes = [".venv/**"]

[tool.uv]
environments = ["sys_platform == 'win32'"]
find-links = ["https://repo.radeon.com/rocm/windows/rocm-rel-7.2.1/"]

[tool.uv.sources]
torch = { url = "https://repo.radeon.com/rocm/windows/rocm-rel-7.2.1/torch-2.9.1%2Brocm7.2.1-cp312-cp312-win_amd64.whl" }
torchvision = { url = "https://repo.radeon.com/rocm/windows/rocm-rel-7.2.1/torchvision-0.24.1%2Brocm7.2.1-cp312-cp312-win_amd64.whl" }
torchaudio = { url = "https://repo.radeon.com/rocm/windows/rocm-rel-7.2.1/torchaudio-2.9.1%2Brocm7.2.1-cp312-cp312-win_amd64.whl" }
