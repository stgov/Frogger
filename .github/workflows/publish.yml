name: Render and Publish Quarto Site

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "quarto-build"
  cancel-in-progress: true

jobs:
  build-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: pre-release

      - name: Render notebook
        run: quarto render main.ipynb --to html

      - name: Prepare index.html for portfolio
        run: |
          cp main.html index.html

      - name: Commit rendered index.html to repo
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html main_files/ 2>/dev/null || true
          if [[ -n $(git status -s) ]]; then
            git commit -m "chore: auto-render quarto output to index.html [skip ci]"
            git push
          fi

      - name: Trigger Portfolio Dispatch
        if: github.event_name == 'push' && env.PORTFOLIO_PAT != ''
        env:
          PORTFOLIO_PAT: ${{ secrets.PORTFOLIO_PAT }}
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PORTFOLIO_PAT }}" \
            https://api.github.com/repos/stgov/stgov.github.io/dispatches \
            -d '{"event_type": "submodule-update"}'